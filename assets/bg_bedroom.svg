<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3041"/>
      <stop offset="100%" stop-color="#2d1a27"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="100%" stop-color="#ff7b54"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="100%" stop-color="#3d2413"/>
    </linearGradient>
  </defs>
  <!-- Room Wall -->
  <rect width="1280" height="520" fill="url(#wallGrad)"/>
  <!-- Wooden Floor -->
  <rect y="520" width="1280" height="200" fill="url(#floorWood)"/>
  <!-- Floor Baseboard -->
  <rect y="510" width="1280" height="10" fill="#22121c"/>
  <!-- Window -->
  <rect x="80" y="80" width="300" height="320" fill="url(#windowSky)" rx="8" stroke="#ffffff" stroke-width="8"/>
  <line x1="230" y1="80" x2="230" y2="400" stroke="#ffffff" stroke-width="6"/>
  <line x1="80" y1="240" x2="380" y2="240" stroke="#ffffff" stroke-width="6"/>
  <!-- Window Curtains -->
  <path d="M70,70 Q 140,240 80,410 L 60,410 Z" fill="#ff69b4" opacity="0.8"/>
  <path d="M390,70 Q 320,240 380,410 L 400,410 Z" fill="#ff69b4" opacity="0.8"/>
  <!-- Bed -->
  <rect x="750" y="380" width="480" height="200" fill="#4a5568" rx="16"/>
  <rect x="750" y="360" width="480" height="60" fill="#e2e8f0" rx="12"/>
  <rect x="770" y="330" width="140" height="50" fill="#ffffff" rx="10"/>
  <rect x="930" y="330" width="140" height="50" fill="#ffffff" rx="10"/>
  <rect x="730" y="440" width="520" height="160" fill="#ff85a2" rx="10"/>
  <!-- Desk & Computer -->
  <rect x="450" y="380" width="220" height="180" fill="#718096" rx="6"/>
  <rect x="480" y="270" width="160" height="100" fill="#1a202c" stroke="#4a5568" stroke-width="4" rx="6"/>
  <polygon points="540,370 580,370 590,380 530,380" fill="#a0aec0"/>
  <!-- Posters on Wall -->
  <rect x="480" y="80" width="120" height="160" fill="#ff69b4" rx="4" stroke="#fff" stroke-width="3"/>
  <text x="500" y="160" fill="#fff" font-size="14" font-weight="bold">SIGMA</text>
  <rect x="640" y="100" width="140" height="180" fill="#00d2ff" rx="4" stroke="#fff" stroke-width="3"/>
  <text x="660" y="180" fill="#fff" font-size="14" font-weight="bold">DDLC</text>
</svg>
