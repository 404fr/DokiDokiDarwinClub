<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <filter id="shadowVictor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadowVictor)">
    <!-- Legs / Tailored Trousers -->
    <rect x="140" y="380" width="45" height="200" fill="#1a237e" rx="4"/>
    <rect x="215" y="380" width="45" height="200" fill="#1a237e" rx="4"/>
    <!-- Italian Leather Shoes -->
    <rect x="130" y="565" width="60" height="25" fill="#3e2723" rx="6"/>
    <rect x="210" y="565" width="60" height="25" fill="#3e2723" rx="6"/>
    <!-- Tailored Purple/Navy Suit Jacket -->
    <rect x="125" y="200" width="150" height="190" fill="url(#suitGrad)" rx="12"/>
    <!-- White Collared Dress Shirt -->
    <polygon points="175,200 200,260 225,200" fill="#ffffff"/>
    <!-- Red Silk Tie -->
    <polygon points="195,215 205,215 210,310 200,325 190,310" fill="#d50000"/>
    <!-- Rose Flower in Lapel (Love Triangle Rival) -->
    <circle cx="145" cy="225" r="10" fill="#ff1744"/>
    <path d="M 145,235 L 145,250" stroke="#2e7d32" stroke-width="3"/>
    <!-- Hands in Pockets Pose -->
    <ellipse cx="120" cy="340" rx="18" ry="25" fill="#e0ac69"/>
    <ellipse cx="280" cy="340" rx="18" ry="25" fill="#e0ac69"/>
    <!-- Neck -->
    <rect x="180" y="160" width="40" height="45" fill="#e0ac69"/>
    <!-- Head -->
    <ellipse cx="200" cy="125" rx="52" ry="60" fill="#e0ac69"/>
    <!-- Stylish K-Pop / Anime Idol Hair (Victor Wiard) -->
    <path d="M 135,110 C 135,40 265,40 265,110 C 240,60 210,70 200,75 C 180,65 150,70 135,110 Z" fill="#263238"/>
    <path d="M 140,105 Q 170,135 185,115" stroke="#37474f" stroke-width="8" fill="none"/>
    <path d="M 260,105 Q 230,135 215,115" stroke="#37474f" stroke-width="8" fill="none"/>
    <!-- Handsome Smug Eyes -->
    <ellipse cx="175" cy="118" rx="9" ry="7" fill="#ffffff"/>
    <circle cx="175" cy="118" r="4" fill="#7b1fa2"/>
    <path d="M 160,110 Q 175,104 190,112" stroke="#263238" stroke-width="3" fill="none"/>
    
    <ellipse cx="225" cy="118" rx="9" ry="7" fill="#ffffff"/>
    <circle cx="225" cy="118" r="4" fill="#7b1fa2"/>
    <path d="M 210,112 Q 225,104 240,110" stroke="#263238" stroke-width="3" fill="none"/>
    <!-- Charming Smirk -->
    <path d="M 185,150 Q 200,162 220,148" stroke="#263238" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Sparkles Floating Around Him (Romance Rival) -->
    <path d="M 90,120 L 95,130 L 105,135 L 95,140 L 90,150 L 85,140 L 75,135 L 85,130 Z" fill="#ff4081"/>
    <path d="M 310,180 L 314,188 L 322,192 L 314,196 L 310,204 L 306,196 L 298,192 L 306,188 Z" fill="#ffd700"/>
  </g>
</svg>
